# The kind cluster `make cluster` creates (scripts/kind-cluster.sh). containerd reads registry
# mirrors from config_path only when it is set at node creation; kind-cluster.sh then drops a
# hosts.toml under it that sends localhost:5001 to the local registry container.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
containerdConfigPatches:
    - |-
      [plugins."io.containerd.grpc.v1.cri".registry]
        config_path = "/etc/containerd/certs.d"
