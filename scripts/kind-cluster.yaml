# The kind cluster `make cluster` creates (scripts/kind-cluster.sh). containerd reads registry
# mirrors from config_path only when it is set at node creation; kind-cluster.sh then drops a
# hosts.toml under it that sends localhost:5001 to the local registry container. The kubelet syncs
# pods every 5 s instead of every minute, so a changed Secret reaches its pod within seconds: the
# lane's rebind grace (scripts/test-k8s.sh) is derived from it.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
containerdConfigPatches:
    - |-
      [plugins."io.containerd.grpc.v1.cri".registry]
        config_path = "/etc/containerd/certs.d"
kubeadmConfigPatches:
    - |
      kind: KubeletConfiguration
      syncFrequency: 5s
