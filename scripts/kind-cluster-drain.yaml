# The multi-node kind cluster `make cluster LAYOUT=drain` creates (scripts/kind-cluster.sh), for the
# node-drain recovery figure of scripts/test-k8s.sh --phase drain (issue #829). One control-plane,
# schedulable so the board, the database and the collector have a node that is never drained, and
# three workers carrying the lane's shared label. Every worker bind-mounts one host directory at
# /factory-shared: the lane's static workspaces volume (ReadWriteMany) lives there, so a task keeps
# its checkout when its pod is rescheduled onto another worker.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
containerdConfigPatches:
    - |-
      [plugins."io.containerd.grpc.v1.cri".registry]
        config_path = "/etc/containerd/certs.d"
nodes:
    - role: control-plane
      kubeadmConfigPatches:
          - |
            kind: InitConfiguration
            nodeRegistration:
              taints: []
    - role: worker
      labels:
          factory.lane/shared: "true"
      extraMounts:
          - hostPath: /tmp/factory-kind-shared
            containerPath: /factory-shared
    - role: worker
      labels:
          factory.lane/shared: "true"
      extraMounts:
          - hostPath: /tmp/factory-kind-shared
            containerPath: /factory-shared
    - role: worker
      labels:
          factory.lane/shared: "true"
      extraMounts:
          - hostPath: /tmp/factory-kind-shared
            containerPath: /factory-shared
