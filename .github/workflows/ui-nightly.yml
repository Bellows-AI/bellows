name: UI nightly

# The browser captures that gate nothing (playwright.nightly.config.ts): off the merge path, run
# once a day and on demand.
on:
    schedule:
        - cron: '17 3 * * *'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ui-nightly
    cancel-in-progress: false

jobs:
    nightly:
        runs-on: ubuntu-latest
        timeout-minutes: 60
        services:
            postgres:
                # The image docker-compose.yml pins, as ci.yml's e2e job does.
                image: public.ecr.aws/docker/library/postgres:17
                env:
                    POSTGRES_USER: factory
                    POSTGRES_PASSWORD: factory
                    POSTGRES_DB: factory_dev
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U factory -d factory_dev"
                    --health-interval 5s --health-timeout 5s --health-retries 10
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: npm
            - name: npm ci
              run: npm ci
            # The nightly config boots the same two boards, so it needs the same two databases.
            - name: create the e2e databases
              env:
                  PGPASSWORD: factory
              run: |
                  psql -h 127.0.0.1 -U factory -d postgres -c 'create database factory_e2e'
                  psql -h 127.0.0.1 -U factory -d postgres -c 'create database factory_auth_e2e'
            - name: npx playwright install --with-deps chromium
              run: npx playwright install --with-deps chromium
            - name: npm run build
              run: npm run build
            - name: npm run verify:ui:nightly
              run: npm run verify:ui:nightly
            - if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: ui-nightly-artifacts
                  path: artifacts/ui
                  retention-days: 7
                  if-no-files-found: warn
