name: gate-diag
on:
    push:
        branches: [fixbel-454-diag]
permissions:
    contents: read
    packages: read
jobs:
    diag:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        services:
            postgres:
                image: ghcr.io/bellows-ai/postgres:17
                credentials:
                    username: ${{ github.actor }}
                    password: ${{ github.token }}
                env:
                    POSTGRES_USER: factory
                    POSTGRES_PASSWORD: factory
                    POSTGRES_DB: factory_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U factory -d factory_test"
                    --health-interval 5s --health-timeout 5s --health-retries 10
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
            - name: npm ci (timed)
              run: /usr/bin/time -v npm ci 2>&1 | tail -25
            - name: diag
              run: GATE_DIAG_TMP_COPY=/dev/shm/work sh scripts/gate-diag.sh postgres://factory:factory@localhost:5432/postgres
