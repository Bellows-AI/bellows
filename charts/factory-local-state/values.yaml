# The state a local `factory` release runs against, in its own release so the app release can be
# uninstalled and reinstalled without taking the database with it. Local only: a real deployment
# points the factory chart's `database.url` at a managed database. Nothing here is a production shape.

postgres:
    # The same plain Postgres container compose runs. The key keeps the name `postgres`
    # because `<release>-postgres` is the object name values-local.yaml, the Makefile and
    # scripts/test-k8s.sh all reach for; the extension itself is gone (#371).
    image: postgres:17
    user: factory
    password: factory
    database: factory_dev
    storageSize: 10Gi
    resources: {}
