{{- if not .Values.driver.credential.existingSecret }}
{{/*
The driver's own credential (docs/auth.md), its own Secret: only the driver pod mounts it, the dashboard
records its SHA-256 and never the value. Kept out of the pods' secret checksum on purpose: a changed
credential reaches the running driver through the kubelet's refresh of the mounted file, with no restart.
*/}}
apiVersion: v1
kind: Secret
metadata:
    name: {{ include "factory.driverSecretName" . }}
    labels:
        {{- include "factory.labels" . | nindent 8 }}
        app.kubernetes.io/component: driver
type: Opaque
stringData:
    credential: {{ .Values.driver.credential.value | quote }}
    {{- with .Values.driver.metricsToken }}
    metrics-token: {{ . | quote }}
    {{- end }}
{{- end }}
