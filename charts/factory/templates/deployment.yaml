{{/*
The dashboard: API and SPA on one port, the same `runtime` stage compose does NOT run and the
Dockerfile calls "what deploys". Its environment block mirrors docker-compose.yml's dashboard
service line for line — the chart sets the same environment the compose file sets, which is the
repo's only configuration mechanism.

Exactly one replica, replaced by Recreate, never rolled. Migrations and S3 artifacts are
replica-safe; what still is not: the filesystem artifact backend (one pod's /tmp), and an old and a
new version sharing one schema mid-rollout, which no test covers. The cost is a few seconds of downtime per upgrade.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
    name: {{ include "factory.fullname" . }}
    labels:
        {{- include "factory.labels" . | nindent 8 }}
        app.kubernetes.io/component: dashboard
spec:
    replicas: 1
    strategy:
        type: Recreate
    selector:
        matchLabels:
            {{- include "factory.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: dashboard
    template:
        metadata:
            labels:
                {{- include "factory.labels" . | nindent 16 }}
                app.kubernetes.io/component: dashboard
            annotations:
                {{- include "factory.secretChecksum" . | nindent 16 }}
                {{- with .Values.podAnnotations }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
        spec:
            serviceAccountName: {{ include "factory.fullname" . }}-dashboard
            # The dashboard calls no Kubernetes API; a mounted token would only be something to steal.
            # IRSA and Pod Identity inject their own projected credentials, which this does not touch.
            automountServiceAccountToken: false
            securityContext:
                # The runtime image's `node` user.
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                seccompProfile:
                    type: RuntimeDefault
            {{- include "factory.podScheduling" . | nindent 12 }}
            # The server's migration retry gives up after ~55s and then keeps serving with no
            # tables — every DB-backed route a 500, and no client-side polling recovers it. A
            # database that is not accepting connections yet (a cold local node still pulling its
            # image, a managed instance mid-failover) must hold the server back, not strand it, so
            # the pod waits on pg_isready against the same DATABASE_URL the server reads — for
            # `database.waitTimeoutSeconds`, then fails visibly and the kubelet retries.
            initContainers:
                - name: wait-for-database
                  image: {{ .Values.database.waitImage }}
                  command:
                      - sh
                      - -c
                      - |
                          deadline=$(( $(date +%s) + WAIT_TIMEOUT_SECONDS ))
                          until pg_isready -q -d "$DATABASE_URL"; do
                              if [ "$(date +%s)" -ge "$deadline" ]; then
                                  echo "database not accepting connections after ${WAIT_TIMEOUT_SECONDS}s" >&2
                                  exit 1
                              fi
                              sleep 1
                          done
                  env:
                      - name: WAIT_TIMEOUT_SECONDS
                        value: {{ .Values.database.waitTimeoutSeconds | quote }}
                      - name: DATABASE_URL
                        valueFrom:
                            secretKeyRef:
                                name: {{ include "factory.secretName" . }}
                                key: database-url
                  {{- include "factory.containerSecurityContext" . | nindent 18 }}
            containers:
                - name: dashboard
                  image: {{ include "factory.image" (list . .Values.dashboard.image) }}
                  imagePullPolicy: {{ .Values.dashboard.imagePullPolicy }}
                  {{- if .Values.dashboard.offline }}
                  # The code-only no-fetch entry. Same image, same routes, same auth wall; nothing
                  # is fetched or cloned, and the App credential is not needed. `args`, not
                  # `command`, so the image's tini entrypoint stays PID 1.
                  args: ['node', 'server/dist/offline.js']
                  {{- end }}
                  ports:
                      - name: http
                        containerPort: {{ .Values.dashboard.port }}
                  # Every Secret key but database-url is optional: templates/validate.yaml refuses
                  # what it can see, and for a bring-your-own Secret the server's boot error names
                  # what is missing — clearer than a CreateContainerConfigError naming only a key.
                  env:
                      # The repo-read credential AND the repo list, both from one GitHub App
                      # installation. Required unless offline.
                      - name: GITHUB_APP_ID
                        value: {{ .Values.github.appId | quote }}
                      - name: GITHUB_APP_PRIVATE_KEY
                        valueFrom:
                            secretKeyRef:
                                name: {{ include "factory.secretName" . }}
                                key: github-app-private-key
                                optional: true
                      # The organizations are the App's installations, materialized at sign-in
                      # (#99) — there is no org env to set. Install the App on every account this
                      # deployment should serve.
                      # Shared admission budgets (server/src/db/job-store-admission.ts); empty is unlimited.
                      - name: ADMISSION_MAX_RUNNING
                        value: {{ .Values.dashboard.admission.maxRunning | quote }}
                      - name: ADMISSION_MAX_RUNNING_PER_ORG
                        value: {{ .Values.dashboard.admission.maxRunningPerOrg | quote }}
                      - name: ADMISSION_MAX_RUNNING_PER_REPO
                        value: {{ .Values.dashboard.admission.maxRunningPerRepo | quote }}
                      {{- if and .Values.dashboard.offline .Values.driver.repoCloneBase }}
                      # The offline entry reads each repo's .bellows.yaml from this origin.
                      - name: REPO_CLONE_BASE
                        value: {{ .Values.driver.repoCloneBase | quote }}
                      {{- end }}
                      - name: TELEMETRY_SOURCE
                        value: {{ .Values.telemetry.source | quote }}
                      - name: TELEMETRY_TTL_SECONDS
                        value: {{ .Values.telemetry.ttlSeconds | quote }}
                      - name: DATABASE_URL
                        valueFrom:
                            secretKeyRef:
                                name: {{ include "factory.secretName" . }}
                                key: database-url
                      # Where task artifacts go (server/src/artifacts/config.ts).
                      - name: ARTIFACTS_BACKEND
                        value: {{ .Values.artifacts.backend | quote }}
                      - name: ARTIFACTS_RETENTION_DAYS
                        value: {{ .Values.artifacts.retentionDays | quote }}
                      - name: ARTIFACTS_ORG_QUOTA_BYTES
                        value: {{ .Values.artifacts.orgQuotaBytes | quote }}
                      {{- if eq .Values.artifacts.backend "s3" }}
                      - name: ARTIFACTS_S3_BUCKET
                        value: {{ .Values.artifacts.s3.bucket | quote }}
                      - name: ARTIFACTS_S3_REGION
                        value: {{ .Values.artifacts.s3.region | quote }}
                      - name: ARTIFACTS_S3_ENDPOINT
                        value: {{ .Values.artifacts.s3.endpoint | quote }}
                      - name: ARTIFACTS_S3_FORCE_PATH_STYLE
                        value: {{ .Values.artifacts.s3.forcePathStyle | quote }}
                      - name: ARTIFACTS_S3_PREFIX
                        value: {{ .Values.artifacts.s3.prefix | quote }}
                      - name: ARTIFACTS_S3_KMS_KEY_ID
                        value: {{ .Values.artifacts.s3.kmsKeyId | quote }}
                      {{- with .Values.artifacts.credentialsExistingSecret }}
                      - name: ARTIFACTS_ACCESS_KEY_ID
                        valueFrom:
                            secretKeyRef:
                                name: {{ . | quote }}
                                key: access-key-id
                      - name: ARTIFACTS_SECRET_ACCESS_KEY
                        valueFrom:
                            secretKeyRef:
                                name: {{ . | quote }}
                                key: secret-access-key
                      {{- end }}
                      {{- end }}
                      # The wall, and not a value: this deployment holds checkouts and serves a
                      # route that runs shell commands, so the chart has no open mode to select.
                      - name: AUTH_MODE
                        value: github
                      - name: GITHUB_OAUTH_CLIENT_ID
                        value: {{ .Values.auth.oauthClientId | quote }}
                      - name: GITHUB_OAUTH_CLIENT_SECRET
                        valueFrom:
                            secretKeyRef:
                                name: {{ include "factory.secretName" . }}
                                key: github-oauth-client-secret
                                optional: true
                      - name: SESSION_SECRET
                        valueFrom:
                            secretKeyRef:
                                name: {{ include "factory.secretName" . }}
                                key: session-secret
                                optional: true
                      # Required — loadConfig refuses to boot github auth without an origin GitHub
                      # can redirect back to.
                      - name: PUBLIC_URL
                        value: {{ .Values.auth.publicUrl | quote }}
                      - name: COOKIE_SECURE
                        value: {{ .Values.auth.cookieSecure | quote }}
                      - name: INGEST_TOKEN
                        valueFrom:
                            secretKeyRef:
                                name: {{ include "factory.secretName" . }}
                                key: ingest-token
                                optional: true
                      # The App's installation webhook: present, the route verifies GitHub's HMAC
                      # against it; empty, the route does not exist at all.
                      - name: GITHUB_WEBHOOK_SECRET
                        valueFrom:
                            secretKeyRef:
                                name: {{ include "factory.secretName" . }}
                                key: github-webhook-secret
                                optional: true
                      # The shared board secret — the same value the driver presents. Required in
                      # github mode: the server refuses to boot without it, which is what names
                      # the missing key.
                      - name: JOB_BOARD_TOKEN
                        valueFrom:
                            secretKeyRef:
                                name: {{ include "factory.secretName" . }}
                                key: job-board-token
                                optional: true
                  {{- with .Values.dashboard.resources }}
                  resources:
                      {{- toYaml . | nindent 22 }}
                  {{- end }}
                  {{- include "factory.containerSecurityContext" . | nindent 18 }}
                  # Startup and readiness read /api/ready: 503 until the migrations land, and 503
                  # for good if they gave up — so a pod whose schema never arrived is never Ready,
                  # and is restarted (retrying the migrations) once the startup budget runs out.
                  # 5s x 30 outlasts the migration retry's ~55s with room for a cold database.
                  startupProbe:
                      httpGet:
                          path: /api/ready
                          port: http
                      periodSeconds: 5
                      failureThreshold: 30
                  readinessProbe:
                      httpGet:
                          path: /api/ready
                          port: http
                      periodSeconds: 10
                  # Liveness is /api/health, which touches neither the database nor GitHub: a
                  # database outage must never restart-loop the pod.
                  livenessProbe:
                      httpGet:
                          path: /api/health
                          port: http
                      periodSeconds: 30
                  volumeMounts:
                      - name: tmp
                        mountPath: /tmp
            volumes:
                - name: tmp
                  emptyDir: {}
