{{/*
The organization's checkouts. The dashboard writes them here; runners mount their own task
volume instead (issue #775). Default ReadWriteMany. Local clusters do not
render this template at all: values-local.yaml sets existingClaim to the factory-local-state
release's claim, which is the ReadWriteOnce one. What the class behind this claim must provide —
RWX, and a root writable by uid 1000 — is docs/kubernetes.md, "The workspaces volume".

Kept on `helm uninstall`: the checkouts hold uncommitted agent work and the database's rows
describe them, so removing the app must not remove them. Delete the claim by hand to reclaim it.
*/}}
{{- if not .Values.workspaces.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: {{ include "factory.workspaceClaim" . }}
    annotations:
        helm.sh/resource-policy: keep
    labels:
        {{- include "factory.labels" . | nindent 8 }}
spec:
    accessModes:
        {{- toYaml .Values.workspaces.accessModes | nindent 8 }}
    {{- with .Values.workspaces.storageClass }}
    storageClassName: {{ . | quote }}
    {{- end }}
    resources:
        requests:
            storage: {{ .Values.workspaces.storageSize }}
{{- end }}
