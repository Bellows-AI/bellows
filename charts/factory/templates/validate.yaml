{{/*
Render-time refusals for configurations the server would otherwise refuse at boot, one crash loop
later. Every check mirrors a loadConfig rule (server/src/config.ts) — or a chart-side
impossibility, like a Secret nothing creates or an Ingress that answers no host its operator's
origin lives on — and names the value to set.
Values that live in `secret.existingSecret` cannot be seen from here — the server still names
those at boot, which is why every such key is `optional` in the pod spec: a missing key reads as
the server's own message, never as an opaque CreateContainerConfigError.
*/}}
{{- if and (not .Values.secret.create) (not .Values.secret.existingSecret) }}
{{- fail "secret.create is false but secret.existingSecret is empty: the pods would reference a Secret nothing creates" }}
{{- end }}
{{- if not .Values.auth.publicUrl }}
{{- fail "auth.publicUrl is required: the origin GitHub redirects back to" }}
{{- end }}
{{- if .Values.ingress.enabled }}
{{- if not .Values.ingress.hosts }}
{{- fail "ingress.hosts is required when ingress.enabled: the Ingress would answer no host at all" }}
{{- end }}
{{- $publicHost := regexFind "//[^:/]+" .Values.auth.publicUrl | trimPrefix "//" }}
{{- if not $publicHost }}
{{- fail (printf "auth.publicUrl must be an absolute origin (scheme://host) when ingress.enabled: no host could be read from %q" .Values.auth.publicUrl) }}
{{- end }}
{{- if not (has $publicHost .Values.ingress.hosts) }}
{{- fail (printf "auth.publicUrl host %q is not among ingress.hosts: GitHub redirects to auth.publicUrl and the Ingress answers ingress.hosts" $publicHost) }}
{{- end }}
{{- end }}
{{- if not (has .Values.artifacts.backend (list "s3" "filesystem")) }}
{{- fail "artifacts.backend must be s3 or filesystem" }}
{{- end }}
{{- $replicas := .Values.dashboard.replicas }}
{{- if not (or (kindIs "int64" $replicas) (kindIs "float64" $replicas)) }}
{{- fail "dashboard.replicas must be a whole number of at least 1" }}
{{- end }}
{{- if or (lt (float64 $replicas) 1.0) (ne (float64 (int64 $replicas)) (float64 $replicas)) }}
{{- fail "dashboard.replicas must be a whole number of at least 1" }}
{{- end }}
{{- if and (gt (int64 $replicas) 1) (eq .Values.artifacts.backend "filesystem") }}
{{- fail (printf "dashboard.replicas above 1 requires artifacts.backend=s3: the filesystem backend is one pod's /tmp (dashboard.replicas=%v, artifacts.backend=filesystem)" $replicas) }}
{{- end }}
{{- if eq .Values.artifacts.backend "s3" }}
{{- if not .Values.artifacts.s3.bucket }}
{{- fail "artifacts.s3.bucket is required when artifacts.backend is s3 (set artifacts.backend=filesystem for a single-replica development install)" }}
{{- end }}
{{- if and (not .Values.artifacts.s3.region) (not .Values.artifacts.s3.endpoint) }}
{{- fail "artifacts.s3.region is required when artifacts.backend is s3 and artifacts.s3.endpoint is empty" }}
{{- end }}
{{- end }}
{{- if not .Values.auth.oauthClientId }}
{{- fail "auth.oauthClientId is required" }}
{{- end }}
{{- if .Values.secret.create }}
{{- if not .Values.secret.oauthClientSecret }}
{{- fail "secret.oauthClientSecret is required" }}
{{- end }}
{{- if lt (len .Values.secret.sessionSecret) 32 }}
{{- fail "secret.sessionSecret of at least 32 characters is required (openssl rand -hex 32)" }}
{{- end }}
{{- if lt (len .Values.secret.jobBoardToken) 32 }}
{{- fail "secret.jobBoardToken of at least 32 characters is required (openssl rand -hex 32): the driver's credential on the worker routes" }}
{{- end }}
{{- end }}
{{- if not .Values.dashboard.offline }}
{{- if not .Values.github.appId }}
{{- fail "github.appId is required: the repo list and the repo-read credential are the GitHub App's (set dashboard.offline=true for the code-only no-fetch entry)" }}
{{- end }}
{{- if and .Values.secret.create (not .Values.github.appPrivateKey) }}
{{- fail "github.appPrivateKey is required alongside github.appId" }}
{{- end }}
{{- end }}
{{- if .Values.global.imageRegistry }}
{{- /* The prefix is a registry PATH (`ghcr.io/<owner>` — GHCR namespaces images under the owner),
so an interior slash is the norm. What cannot render is anything that makes the composed
reference malformed: a trailing slash (`ghcr.io/owner/` composes `ghcr.io/owner//factory-ai`), a
doubled slash — a pasted URL's scheme among them — a `scheme:/` typo, surrounding whitespace, or
any uppercase at all: docker's reference grammar is lowercase-only. A colon is otherwise left
alone — it is how a bare registry host spells its port (`registry:5000`). All of these are
invalid docker references the kubelet would only name after install. */}}
{{- if or (hasSuffix "/" .Values.global.imageRegistry) (contains "//" .Values.global.imageRegistry) (contains ":/" .Values.global.imageRegistry) (ne .Values.global.imageRegistry (trim .Values.global.imageRegistry)) (ne .Values.global.imageRegistry (lower .Values.global.imageRegistry)) }}
{{- fail "global.imageRegistry must be a lowercase registry path such as ghcr.io/<owner>: no trailing or doubled slash, no scheme, no surrounding whitespace" }}
{{- end }}
{{- $repositories := dict
    "dashboard.image.repository" .Values.dashboard.image.repository
    "driver.image.repository" .Values.driver.image.repository
    "collector.image.repository" .Values.collector.image.repository
    "driver.executorImages.claudeCode" .Values.driver.executorImages.claudeCode
    "driver.executorImages.opencode" .Values.driver.executorImages.opencode }}
{{- range $path, $repository := $repositories }}
{{- /* The component before the first `/` qualifies as a registry by docker's own rule — it
contains a `.` or a `:` (or is `localhost`) — so a tag's colon with no slash after it
(`claude-executor:v1.2.3`) is not a false positive. database.waitImage is excluded on purpose:
it is never prefixed, always a full reference. */}}
{{- if regexMatch "^([^/]*[.:][^/]*|localhost)/" $repository }}
{{- fail (printf "global.imageRegistry is set and %s (%q) already names a registry: set the bare repository and let the prefix compose, or leave global.imageRegistry empty" $path $repository) }}
{{- end }}
{{- end }}
{{- end }}
