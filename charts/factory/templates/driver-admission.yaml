{{- if .Values.isolation.admissionPolicy }}
{{/*
The fence RBAC cannot draw (see driver-rbac.yaml): two ValidatingAdmissionPolicies bound to the
driver's ServiceAccount and this namespace. Cluster-scoped objects, so their names carry the
namespace; they need Kubernetes >= 1.30 (admissionregistration.k8s.io/v1), and a cluster without
the API fails the install loudly rather than installing an unfenced driver.

`-pods` fences what a pod the driver specs may hold — the runner Job's task pod with its gate and
service sidecars, every aux Job — because `create jobs` would otherwise be `read every Secret`:
  - Secrets a container can read (volumes, env, envFrom) only when they are the driver's own
    per-attempt ones (factory-job-…-env, docs/kubernetes.md) or the
    runner credentials. The chart's pull secrets only under imagePullSecrets — the kubelet reads
    those, a container never does. The dashboard Secret is none of these.
  - volumes: the workspaces claim, emptyDir, and such Secrets — no hostPath, no other claim, no
    projected ServiceAccount token, no CSI driver.
  - every mount of the workspaces claim carries a subPath of the driver's WORKSPACE_PATH shape
    (`<org>/<user id>`, driver/src/publish.ts) and no subPathExpr, so no pod mounts the claim root.
  - no ServiceAccount token, no other ServiceAccount, no host namespaces, nothing privileged, no
    added capabilities.
  - the executor hardening is REQUIRED, not merely permitted (#382): the RuntimeDefault seccomp
    profile on the pod, `allowPrivilegeEscalation: false` and `capabilities.drop: [ALL]` on every
    container. Forbidding `privileged` and requiring the drop are different controls; a client
    that sets neither satisfies only the first.
  - the task pod's shape (#773): `hostAliases` map only to 127.0.0.1 (a declared service's name),
    and a `svc-` container is only a restartable init container — the restartable ones are the
    `gate`, the `reviewer` and the `svc-` services, nothing else.
  - the reviewer (#774) runs as uid 1002 and mounts the workspace read-only, its review mailbox
    and its home, nothing else.
`-resize` fences the one in-place resize the driver makes (issue #773): a `pods/resize` update of a
pod it labelled `factory.job` that changes no main container and no init container but `gate` or `reviewer`, one of them.
`-objects` fences what the driver may create and delete: only objects labelled `factory.job` (the
label every runner-owned object carries), so the dashboard's Secret and ConfigMaps are out of
reach; Secrets only under the per-attempt names and only Opaque (a service-account-token Secret
would mint credentials); pods only deleted (the re-claim fence's sweep). The one update it
admits is a checkout claim's revoke (issue #821): the Role's `patch` on configmaps is
namespace-wide, so an update reaches only a `factory-job-<id>-claim` ConfigMap, keeps its labels
and data, and changes no annotation but `factory.revoked`.

Limits, stated: the per-attempt Secret names do not carry the release, so in a namespace shared by
two releases one driver can still reach the other's per-attempt objects — install one release per
namespace. Admission sees no job, so the workspace subPath is fenced by shape, not by owner: a
compromised driver can still name another member's `<org>/<user id>` subtree. A mutating sidecar injector (a service mesh) adds volumes and containers this policy refuses on
runner pods; exclude the namespace from injection. Seccomp is required here (#382); AppArmor and sysctls
are still left to Pod Security Admission — label the namespace
`pod-security.kubernetes.io/enforce: baseline` for those. None of this is kernel or VM isolation:
it is a smaller share of one shared kernel, not a different one (docs/security.md).
*/}}
{{- $fullname := include "factory.fullname" . }}
{{- $name := printf "%s-%s-driver" .Release.Namespace $fullname | trunc 240 | trimSuffix "-" }}
{{- $user := printf "system:serviceaccount:%s:%s-driver" .Release.Namespace $fullname }}
{{- $allowed := list }}
{{- if include "factory.runnerSecretEnabled" . }}
{{- $allowed = append $allowed (include "factory.runnerSecretName" .) }}
{{- end }}
{{- $secretName := "^factory-job-[a-z0-9-]+-env$" }}
{{- $workspaceSubPath := "^[A-Za-z0-9][A-Za-z0-9_-]{0,38}/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
    name: {{ $name }}-pods
    labels:
        {{- include "factory.labels" . | nindent 8 }}
spec:
    failurePolicy: Fail
    matchConstraints:
        resourceRules:
            - apiGroups: ['batch']
              apiVersions: ['v1']
              operations: ['CREATE']
              resources: ['jobs']
    matchConditions:
        - name: the-driver
          expression: {{ printf "request.userInfo.username == '%s'" $user | quote }}
    variables:
        - name: spec
          expression: "object.spec.template.spec"
        - name: containers
          expression: "variables.spec.containers + (has(variables.spec.initContainers) ? variables.spec.initContainers : [])"
        - name: allowed
          expression: {{ toJson $allowed | quote }}
        - name: pullSecrets
          expression: {{ toJson .Values.imagePullSecrets | quote }}
        - name: workspaceVolumes
          expression: >-
              has(variables.spec.volumes) ? variables.spec.volumes.filter(v,
                has(v.persistentVolumeClaim) && v.persistentVolumeClaim.claimName == {{ include "factory.workspaceClaim" . | squote }}
              ).map(v, v.name) : []
    validations:
        - expression: "has(variables.spec.automountServiceAccountToken) && variables.spec.automountServiceAccountToken == false"
          message: 'a driver-specced pod must set automountServiceAccountToken: false'
        - expression: "!has(variables.spec.serviceAccountName) || variables.spec.serviceAccountName in ['', 'default']"
          message: 'a driver-specced pod runs as the default ServiceAccount'
        - expression: "!has(variables.spec.nodeName) || variables.spec.nodeName == ''"
          message: 'a driver-specced pod is placed by the scheduler, never pinned to a node'
        - expression: >-
              variables.containers.all(c, !has(c.ports) || c.ports.all(p, !has(p.hostPort) || p.hostPort == 0))
          message: 'a driver-specced container may not bind a host port'
        - expression: >-
              !(has(variables.spec.hostNetwork) && variables.spec.hostNetwork) &&
              !(has(variables.spec.hostPID) && variables.spec.hostPID) &&
              !(has(variables.spec.hostIPC) && variables.spec.hostIPC)
          message: 'a driver-specced pod may not share host namespaces'
        - expression: >-
              !has(variables.spec.volumes) || variables.spec.volumes.all(v,
                (has(v.persistentVolumeClaim) && v.persistentVolumeClaim.claimName == {{ include "factory.workspaceClaim" . | squote }}) ||
                has(v.emptyDir) ||
                (has(v.secret) && has(v.secret.secretName) &&
                  (v.secret.secretName.matches({{ squote $secretName }}) || v.secret.secretName in variables.allowed)))
          message: 'a driver-specced pod may mount only the workspaces claim, emptyDir, and its own per-attempt Secrets'
        - expression: >-
              variables.containers.all(c, !has(c.volumeMounts) || c.volumeMounts.all(m,
                !(m.name in variables.workspaceVolumes) ||
                (!has(m.subPathExpr) && has(m.subPath) && m.subPath.matches({{ squote $workspaceSubPath }}))))
          message: 'a driver-specced pod may mount the workspaces claim only at a member subPath (<org>/<user id>)'
        - expression: >-
              !has(variables.spec.imagePullSecrets) ||
              variables.spec.imagePullSecrets.all(p, has(p.name) && p.name in variables.pullSecrets)
          message: 'a driver-specced pod may pull only with the chart imagePullSecrets'
        - expression: >-
              variables.containers.all(c,
                (!has(c.env) || c.env.all(e,
                  !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef) ||
                  (has(e.valueFrom.secretKeyRef.name) &&
                    (e.valueFrom.secretKeyRef.name.matches({{ squote $secretName }}) ||
                     e.valueFrom.secretKeyRef.name in variables.allowed)))) &&
                (!has(c.envFrom) || c.envFrom.all(f,
                  !has(f.secretRef) ||
                  (has(f.secretRef.name) &&
                    (f.secretRef.name.matches({{ squote $secretName }}) || f.secretRef.name in variables.allowed)))))
          message: 'a driver-specced pod may read only its own per-attempt Secrets and the runner credentials'
        {{/*
        Issue #814: one container may add a capability, and only these two. A runner Job's `agent`
        starts as root with CAP_SETUID and CAP_SETGID, which its tool broker keeps to start each of
        the agent's commands as the tool uid; factory-launch drops both, and root, before the CLI
        runs. Container names are unique across a pod's containers and initContainers, so no other
        container can carry them.
        */}}
        - expression: >-
              variables.containers.all(c, !has(c.securityContext) || (
                !(has(c.securityContext.privileged) && c.securityContext.privileged) &&
                (!has(c.securityContext.capabilities) || !has(c.securityContext.capabilities.add) ||
                  size(c.securityContext.capabilities.add) == 0 ||
                  (request.kind.kind == 'Job' && c.name == 'agent' &&
                    c.securityContext.capabilities.add.all(a, a in ['SETUID', 'SETGID'])))))
          message: 'a driver-specced container may not be privileged or add capabilities, but for the agent launch pair'
        {{/*
        Issue #382. Everything above FORBIDS a dangerous shape; these three REQUIRE the safe one,
        which is a different control: a driver that silently stopped setting `capabilities.drop`
        satisfies every expression above and would be admitted. These are what make the hardening
        an invariant of the namespace rather than a habit of one client.
        */}}
        - expression: >-
              has(variables.spec.securityContext) && has(variables.spec.securityContext.seccompProfile) &&
              variables.spec.securityContext.seccompProfile.type == 'RuntimeDefault'
          message: 'a driver-specced pod must run under the RuntimeDefault seccomp profile'
        {{/*
        And the container cannot take back what the pod just granted. A container-level
        `seccompProfile` OVERRIDES the pod-level one, so the validation above on its own would
        require the invariant and admit its exact negation one field deeper: a pod carrying
        `RuntimeDefault` with a container carrying `Unconfined` runs unfiltered. Any explicit
        container profile must therefore be RuntimeDefault; absent is fine, and is what the driver
        actually emits — it sets seccomp once, at the pod. `variables.containers` includes
        initContainers, so this covers them too.
        */}}
        - expression: >-
              variables.containers.all(c, !has(c.securityContext) || !has(c.securityContext.seccompProfile) ||
                c.securityContext.seccompProfile.type == 'RuntimeDefault')
          message: 'a driver-specced container may not override the pod seccomp profile'
        - expression: >-
              variables.containers.all(c, has(c.securityContext) &&
                has(c.securityContext.allowPrivilegeEscalation) &&
                c.securityContext.allowPrivilegeEscalation == false)
          message: 'a driver-specced container must set allowPrivilegeEscalation: false'
        - expression: >-
              variables.containers.all(c, has(c.securityContext) && has(c.securityContext.capabilities) &&
                has(c.securityContext.capabilities.drop) && 'ALL' in c.securityContext.capabilities.drop)
          message: 'a driver-specced container must drop ALL capabilities'
        {{/*
        Issue #773. A declared service is a sidecar of the task pod, reached on the pod's own
        loopback by its name: `hostAliases` may point nowhere else, or a name the agent dials could
        be sent off the pod. Only a restartable init container may be a `svc-` service, and the
        restartable ones are the gate, the reviewer and the services, nothing else (driver/src/k8s-podspec.ts).
        */}}
        - expression: >-
              !has(variables.spec.hostAliases) || variables.spec.hostAliases.all(h, h.ip == '127.0.0.1')
          message: 'a driver-specced pod maps hostAliases only to 127.0.0.1'
        - expression: >-
              variables.spec.containers.all(c, !c.name.startsWith('svc-')) &&
              (!has(variables.spec.initContainers) || variables.spec.initContainers.all(c,
                (has(c.restartPolicy) && c.restartPolicy == 'Always') ==
                  (c.name == 'gate' || c.name == 'reviewer' || c.name.startsWith('svc-'))))
          message: 'a driver-specced pod runs its gate, reviewer and svc- services only as restartable init containers'
        {{/*
        Issue #774. The reviewer is a restartable init container of its own uid (1002,
        driver/src/claim.ts REVIEWER_UID): never the CLI's 1000, the tool's 1001 or any other, and
        it mounts the member's workspace read-only, its review mailbox and its home, nothing else.
        */}}
        - expression: >-
              variables.spec.containers.all(c, c.name != 'reviewer') &&
              (!has(variables.spec.initContainers) || variables.spec.initContainers.all(c, c.name != 'reviewer' ||
                (has(c.securityContext) && has(c.securityContext.runAsUser) && c.securityContext.runAsUser == 1002)))
          message: 'a driver-specced reviewer runs as its own uid'
        - expression: >-
              !has(variables.spec.initContainers) || variables.spec.initContainers.all(c, c.name != 'reviewer' ||
                !has(c.volumeMounts) || c.volumeMounts.all(m,
                  (m.name == 'workspaces' && has(m.readOnly) && m.readOnly) ||
                  m.name == 'ctl-review' || m.name == 'reviewer-home'))
          message: 'a driver-specced reviewer mounts its workspace read-only, its review mailbox and its home'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
    name: {{ $name }}-pods
    labels:
        {{- include "factory.labels" . | nindent 8 }}
spec:
    policyName: {{ $name }}-pods
    validationActions: [Deny]
    matchResources:
        namespaceSelector:
            matchLabels:
                kubernetes.io/metadata.name: {{ .Release.Namespace }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
    name: {{ $name }}-resize
    labels:
        {{- include "factory.labels" . | nindent 8 }}
spec:
    failurePolicy: Fail
    matchConstraints:
        resourceRules:
            - apiGroups: ['']
              apiVersions: ['v1']
              operations: ['UPDATE']
              resources: ['pods/resize']
    matchConditions:
        - name: the-driver
          expression: {{ printf "request.userInfo.username == '%s'" $user | quote }}
    variables:
        - name: oldInit
          expression: "has(oldObject.spec.initContainers) ? oldObject.spec.initContainers : []"
        - name: newInit
          expression: "has(object.spec.initContainers) ? object.spec.initContainers : []"
        - name: changed
          expression: "variables.newInit.filter(c, !variables.oldInit.exists(o, o == c))"
    validations:
        - expression: "has(object.metadata.labels) && 'factory.job' in object.metadata.labels"
          message: 'the driver resizes only pods it labelled factory.job'
        - expression: "object.spec.containers == oldObject.spec.containers"
          message: 'a driver resize changes no main container'
        - expression: >-
              size(variables.newInit) == size(variables.oldInit) &&
              size(variables.changed) <= 1 &&
              variables.changed.all(c, c.name == 'gate' || c.name == 'reviewer')
          message: 'a driver resize changes the gate or the reviewer container alone'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
    name: {{ $name }}-resize
    labels:
        {{- include "factory.labels" . | nindent 8 }}
spec:
    policyName: {{ $name }}-resize
    validationActions: [Deny]
    matchResources:
        namespaceSelector:
            matchLabels:
                kubernetes.io/metadata.name: {{ .Release.Namespace }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
    name: {{ $name }}-objects
    labels:
        {{- include "factory.labels" . | nindent 8 }}
spec:
    failurePolicy: Fail
    matchConstraints:
        resourceRules:
            - apiGroups: ['']
              apiVersions: ['v1']
              operations: ['CREATE', 'DELETE']
              resources: ['secrets', 'configmaps']
            - apiGroups: ['']
              apiVersions: ['v1']
              operations: ['DELETE']
              resources: ['pods']
            - apiGroups: ['']
              apiVersions: ['v1']
              operations: ['UPDATE']
              resources: ['configmaps']
            - apiGroups: ['batch']
              apiVersions: ['v1']
              operations: ['CREATE', 'DELETE']
              resources: ['jobs']
    matchConditions:
        - name: the-driver
          expression: {{ printf "request.userInfo.username == '%s'" $user | quote }}
    variables:
        # A DELETE carries the stored object as oldObject and no object; an UPDATE carries both.
        - name: target
          expression: "request.operation == 'DELETE' ? oldObject : object"
        # Read only under an UPDATE (variables are lazy): the claim's annotations before and after.
        - name: oldAnnotations
          expression: "has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {}"
        - name: newAnnotations
          expression: "has(object.metadata.annotations) ? object.metadata.annotations : {}"
    validations:
        - expression: "has(variables.target.metadata.labels) && 'factory.job' in variables.target.metadata.labels"
          message: 'the driver creates and deletes only objects labelled factory.job'
        - expression: >-
              request.operation != 'UPDATE' ||
              (oldObject.metadata.name.matches('^factory-job-[0-9a-f-]+-claim$') &&
                has(oldObject.metadata.labels) && 'factory.job' in oldObject.metadata.labels)
          message: 'the driver updates only checkout claims'
        - expression: >-
              request.operation != 'UPDATE' ||
              (has(object.metadata.labels) && object.metadata.labels == oldObject.metadata.labels &&
                has(object.data) && has(oldObject.data) && object.data == oldObject.data &&
                variables.newAnnotations.all(k, k == 'factory.revoked' ||
                  (k in variables.oldAnnotations && variables.oldAnnotations[k] == variables.newAnnotations[k])) &&
                variables.oldAnnotations.all(k, k == 'factory.revoked' || k in variables.newAnnotations))
          message: 'a checkout claim update keeps its labels and data, and changes only factory.revoked'
        - expression: >-
              request.kind.kind != 'Secret' ||
              (variables.target.metadata.name.matches({{ squote $secretName }}) &&
                (request.operation == 'DELETE' || !has(object.type) || object.type == 'Opaque'))
          message: 'the driver manages only Opaque per-attempt Secrets'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
    name: {{ $name }}-objects
    labels:
        {{- include "factory.labels" . | nindent 8 }}
spec:
    policyName: {{ $name }}-objects
    validationActions: [Deny]
    matchResources:
        namespaceSelector:
            matchLabels:
                kubernetes.io/metadata.name: {{ .Release.Namespace }}
{{- end }}
