{{/*
The dashboard's identity. It ran as the namespace's `default` ServiceAccount, which an IRSA role
annotation or an EKS Pod Identity association must not be attached to (every other pod here that
names no account would share it). The artifact store's cloud credentials come through this account:
`dashboard.serviceAccount.annotations` carries the IRSA role ARN, and a Pod Identity association
targets the name below. With `create: false` the account is managed outside the chart under the same
name. It holds no Role: the dashboard calls no Kubernetes API.
*/}}
{{- if .Values.dashboard.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
    name: {{ include "factory.fullname" . }}-dashboard
    labels:
        {{- include "factory.labels" . | nindent 8 }}
        app.kubernetes.io/component: dashboard
    {{- with .Values.dashboard.serviceAccount.annotations }}
    annotations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
{{- end }}
