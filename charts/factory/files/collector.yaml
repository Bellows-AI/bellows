# The OTLP collector the chart ships: receives from the runner pods the driver spawns in this
# namespace and forwards to this release's dashboard ingest route. The kubernetes analogue of the
# `collector` service in docker-compose.yml.
#
# This file is not shared with docker/otel-collector.yaml: the two differ exactly where they must —
# the exporter's target (a compose service name there, a templated service URL here) and the pod's
# operational pair (the health_check extension its probes read, the memory_limiter its memory limit
# needs). The decisions that must NOT differ — identity stripped, cost refused, compression off,
# http/json, the session id kept, each export's attempt credential forwarded — are deliberate
# copies; docs/telemetry.md is the reading list for which ones are guarded by a test.
extensions:
    # The pod's liveness and readiness probes read this.
    health_check:
        endpoint: 0.0.0.0:13133
    # Each export's attempt credential (x-factory-job-id + x-factory-ingest-token, the headers every
    # runner export carries) is kept as client metadata by the receivers (include_metadata)
    # and is written back onto the dashboard request here: the board resolves every
    # export's organization from it and refuses one without it.
    headers_setter:
        headers:
            - action: upsert
              key: x-factory-job-id
              from_context: x-factory-job-id
            - action: upsert
              key: x-factory-ingest-token
              from_context: x-factory-ingest-token

receivers:
    otlp:
        protocols:
            grpc:
                endpoint: 0.0.0.0:4317
                include_metadata: true
            http:
                endpoint: 0.0.0.0:4318
                include_metadata: true

processors:
    # First in every pipeline: under a burst the collector refuses data instead of growing until
    # the container's memory limit kills it and drops everything it was holding.
    memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 20

    # Defence in depth. The server's ATTR_ALLOWLIST is the real guarantee, but dropping identity
    # here means it never crosses the pod boundary either.
    attributes/strip-identity:
        actions:
            - key: user.email
              action: delete
            - key: user.id
              action: delete
            - key: user.account_uuid
              action: delete
            - key: user.account_id
              action: delete
            - key: user.groups
              action: delete
            - key: organization.id
              action: delete
            - key: workspace.host_paths
              action: delete

    # Cost is out of scope, so it is refused before it can reach the volume. Both executor
    # surfaces name it differently (claude-code natively, opencode via its OTLP plugin).
    filter/drop-cost:
        error_mode: ignore
        metrics:
            metric:
                - 'name == "claude_code.cost.usage"'
                - 'name == "opencode.cost.usage"'

exporters:
    # The dashboard is a ClusterIP service in the same namespace; the `dashboard` alias compose
    # hardcodes is the release name here. The OTLP http exporter appends /v1/metrics, which is the
    # server's ingest route.
    otlp_http/dashboard:
        endpoint: http://{{ include "factory.fullname" . }}:{{ .Values.dashboard.port }}/api/otlp
        encoding: json
        # Required. The exporter gzips by default, Fastify's JSON parser does not decompress, and
        # the result is a flat 400 on every export. This hop is in-cluster with kilobyte payloads,
        # so compression buys nothing.
        compression: none
        tls:
            insecure: true
        retry_on_failure:
            enabled: true
            initial_interval: 5s
            max_elapsed_time: 300s
        auth:
            authenticator: headers_setter
        # No batch processor anywhere: one keyed on the credential headers keeps a partition per
        # attempt for the collector's whole life and refuses data past its cardinality limit, and
        # one keyed on nothing drops the request context the headers ride. Each export instead
        # goes out as it came in; this queue buffers and retries it with its own context (0.161.0:
        # a 503 is retried under the same attempt's headers). Stated, never left to a default.
        sending_queue:
            enabled: true

service:
    extensions: [health_check, headers_setter]
    telemetry:
        logs:
            level: warn
    pipelines:
        metrics:
            receivers: [otlp]
            processors: [memory_limiter, filter/drop-cost, attributes/strip-identity]
            exporters: [otlp_http/dashboard]
        logs:
            receivers: [otlp]
            processors: [memory_limiter, attributes/strip-identity]
            exporters: [otlp_http/dashboard]
