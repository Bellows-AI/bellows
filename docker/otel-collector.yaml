# Why a collector at all, when the server could receive OTLP directly:
#   - it speaks both grpc (4317) and http (4318), so the agent's protocol choice stops
#     mattering, and http/json is the least-exercised OTLP encoding;
#   - it queues and retries across a dashboard restart, so a `docker compose up --build`
#     does not lose a session's metrics;
#   - it is a second place to drop anything sensitive, independent of the server's allowlist.

# Each export's attempt credential (x-factory-job-id + x-factory-ingest-token, the headers every
# runner export carries) is kept as client metadata by the receivers (include_metadata) and
# is written back onto the dashboard request here: the board resolves every export's
# organization from it and refuses one without it.
extensions:
    headers_setter:
        headers:
            - action: upsert
              key: x-factory-job-id
              from_context: x-factory-job-id
            - action: upsert
              key: x-factory-ingest-token
              from_context: x-factory-ingest-token

receivers:
    otlp:
        protocols:
            grpc:
                endpoint: 0.0.0.0:4317
                include_metadata: true
            http:
                endpoint: 0.0.0.0:4318
                include_metadata: true

processors:
    # Defence in depth. The server's ATTR_ALLOWLIST is the real guarantee, but dropping
    # identity here means it never crosses the container boundary either.
    attributes/strip-identity:
        actions:
            - key: user.email
              action: delete
            - key: user.id
              action: delete
            - key: user.account_uuid
              action: delete
            - key: user.account_id
              action: delete
            - key: user.groups
              action: delete
            - key: organization.id
              action: delete
            - key: workspace.host_paths
              action: delete

    # Cost is out of scope, so it is refused before it can reach the volume. Both executor
    # surfaces name it differently (claude-code natively, opencode via its OTLP plugin).
    filter/drop-cost:
        error_mode: ignore
        metrics:
            metric:
                - 'name == "claude_code.cost.usage"'
                - 'name == "opencode.cost.usage"'

exporters:
    # http/json rather than protobuf: the server's ingest route parses OTLP/JSON, which keeps
    # the flattener testable with hand-written fixtures and no protobuf toolchain.
    otlp_http/dashboard:
        endpoint: http://dashboard:8080/api/otlp
        encoding: json
        # Required. The exporter gzips by default, Fastify's JSON parser does not decompress,
        # and the result is a flat 400 on every export with "Dropping data" in the collector
        # log. This hop is localhost with kilobyte payloads, so compression buys nothing.
        compression: none
        tls:
            insecure: true
        retry_on_failure:
            enabled: true
            initial_interval: 5s
            max_elapsed_time: 300s
        auth:
            authenticator: headers_setter
        # No batch processor anywhere: one keyed on the credential headers keeps a partition per
        # attempt for the collector's whole life and refuses data past its cardinality limit, and
        # one keyed on nothing drops the request context the headers ride. Each export instead
        # goes out as it came in; this queue buffers and retries it with its own context (0.161.0:
        # a 503 is retried under the same attempt's headers). Stated, never left to a default.
        sending_queue:
            enabled: true

service:
    extensions: [headers_setter]
    telemetry:
        logs:
            level: warn
    pipelines:
        metrics:
            receivers: [otlp]
            processors: [filter/drop-cost, attributes/strip-identity]
            exporters: [otlp_http/dashboard]
        logs:
            receivers: [otlp]
            processors: [attributes/strip-identity]
            exporters: [otlp_http/dashboard]
