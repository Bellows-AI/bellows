# The gates run in the dev runner image (docker/dev-runner), pinned to the release that published it.
# test:jobs needs a docker daemon: it runs under a docker runner class (a Kata microVM RuntimeClass).
environment:
    image: ghcr.io/bellows-ai/dev-runner:v0.0.17
    setup: "npm ci && sh scripts/gate-jq.sh"
    gates:
         - name: test
           command: "npm test"
         - name: lint
           command: "npm run lint"
         # The budgets, in minutes, each capped by the driver's DRIVER_JOB_TIMEOUT_MS.
         - name: typecheck
           command: "npm run typecheck"
           timeout: 15
         - name: "test:db"
           command: "DATABASE_URL=postgres://factory:factory@postgres:5432/factory_test npm run test:db"
           timeout: 30
         # Only the phases the change maps to (scripts/gate-test-jobs.sh); the full lane took ~23 min in a microVM.
         - name: "test:jobs"
           command: "TEST_JOBS_PG_URL=postgres://factory:factory@postgres:5432 sh scripts/gate-test-jobs.sh"
           timeout: 45

services:
    - name: postgres
      image: postgres:17
      user: "999:999"
      ports: [5432]
      environment:
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: factory
          POSTGRES_DB: factory_test
    - name: s3
      image: rustfs/rustfs:1.0.1
      user: "10001:10001"
      ports: [9000]
      environment:
          RUSTFS_ACCESS_KEY: factory
          RUSTFS_SECRET_KEY: factory-dev
