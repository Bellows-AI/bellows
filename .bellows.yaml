# The gates run in the dev runner image (docker/dev-runner), pinned to the release that published it.
# No gate needs a docker daemon: the docker lane (npm run test:jobs) runs nightly, as the kind lane does.
environment:
    image: ghcr.io/bellows-ai/dev-runner:v0.0.17
    setup: "npm ci && sh scripts/gate-jq.sh"
    gates:
         # lint and typecheck run at the finish, one after another. The test suites are on demand: the
         # agent runs the ones its change needs while it works, and CI signs off.
         # CI's npm test and npm run test:db stay the merge gate.
         # An on_demand gate runs only ad hoc, which waits at most 10 minutes, so each declares 10.
         # test and test:db run only the suites the change since origin/$BELLOWS_BASE_BRANCH reaches
         # (scripts/gate-test-changed.sh). Each test gate builds core itself (the script, pretest:db,
         # pretest:executors), and typecheck's tsc -b does too.
         # test and test:executors run three forks (TEST_FORKS, vitest.forks.ts), not six: six forks
         # reporting to one vitest process in a microVM starved it, and the workers' RPC timed out
         # ("Timeout calling onTaskUpdate") with every test passed.
         - name: test
           command: "TEST_FORKS=3 sh scripts/gate-test-changed.sh"
           timeout: 10
           on_demand: true
         - name: lint
           command: "npm run lint"
         - name: typecheck
           command: "npm run typecheck"
           timeout: 15
         - name: "test:db"
           # The service is throwaway: durability off, and twice the default workers, since in a microVM
           # the suite waits on round trips and WAL syncs, not CPU.
           command: "sh scripts/gate-pg-fast.sh postgres://factory:factory@postgres:5432/postgres && TEST_DB_WORKERS=8 DATABASE_URL=postgres://factory:factory@postgres:5432/factory_test sh scripts/gate-test-changed.sh --db"
           timeout: 10
           on_demand: true
         # The in-process driver, supervisor and job-route suites, whatever the change touched: no daemon.
         - name: "test:executors"
           command: "TEST_FORKS=3 npm run test:executors"
           timeout: 10
           on_demand: true
         # verify:ui in a real chromium against the declared postgres (scripts/gate-ui.sh): the agent's
         # image has no browser libraries. On demand, filtered to the specs a change touches, and at
         # most 10 minutes so the agent may run it while it works. CI's verify:ui stays the full check.
         - name: ui
           command: "sh scripts/gate-ui.sh"
           timeout: 10
           on_demand: true
           filter: true

services:
    - name: postgres
      image: postgres:17
      user: "999:999"
      ports: [5432]
      # The data directory lives in memory (the test:db data is ~1.2 GiB): on a microVM's virtiofs
      # rootfs test:db ran over four times slower. PGDATA is a subdirectory because the mount root is
      # root-owned, and postgres (uid 999) can own only what it creates.
      tmpfs: [/var/lib/postgresql/data:2Gi]
      environment:
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: factory
          POSTGRES_DB: factory_test
          PGDATA: /var/lib/postgresql/data/pgdata
    - name: s3
      image: rustfs/rustfs:1.0.1
      user: "10001:10001"
      ports: [9000]
      environment:
          RUSTFS_ACCESS_KEY: factory
          RUSTFS_SECRET_KEY: factory-dev
