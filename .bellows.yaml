# The gates run in the dev runner image (docker/dev-runner), pinned to the release that published it.
# test:jobs needs a docker daemon: it runs under a docker runner class (a Kata microVM RuntimeClass).
environment:
    image: ghcr.io/bellows-ai/dev-runner:v0.0.17
    setup: "npm ci && sh scripts/gate-jq.sh"
    gates:
         - name: diag
           command: "GATE_DIAG_TMP_COPY=/dev/shm/work sh scripts/gate-diag.sh postgres://factory:factory@postgres:5432/postgres"
           timeout: 30

services:
    - name: postgres
      image: postgres:17
      user: "999:999"
      ports: [5432]
      environment:
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: factory
          POSTGRES_DB: factory_test
    - name: s3
      image: rustfs/rustfs:1.0.1
      user: "10001:10001"
      ports: [9000]
      environment:
          RUSTFS_ACCESS_KEY: factory
          RUSTFS_SECRET_KEY: factory-dev
