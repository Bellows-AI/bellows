environment:
    image: ghcr.io/bellows-ai/factory-ui-runner:playwright-1.62.1
    setup: "npm ci"
    gates:
         - name: test
           command: "npm test"
         - name: lint
           command: "npm run lint"
         - name: ui
           command: "sh scripts/ui-gate.sh"
           timeout: 45
           on_demand: true

services:
    - name: postgres
      image: postgres:17
      user: "999:999"
      environment:
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: factory
          POSTGRES_DB: factory_test
