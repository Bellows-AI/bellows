environment:
    image: node:24
    setup: "npm ci && sh scripts/gate-jq.sh"
    gates:
         - name: test
           command: "npm test"
         - name: lint
           command: "npm run lint"

services:
    - name: postgres
      image: postgres:17
      user: "999:999"
      environment:
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: factory
          POSTGRES_DB: factory_test
    - name: s3
      image: rustfs/rustfs:1.0.1
      user: "10001:10001"
      environment:
          RUSTFS_ACCESS_KEY: factory
          RUSTFS_SECRET_KEY: factory-dev
