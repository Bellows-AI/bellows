environment:
    image: node:24
    setup: "npm ci && curl -fsSL -o node_modules/.bin/jq https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64 && chmod +x node_modules/.bin/jq"
    gates:
         - name: test
           command: "npm test"
         - name: lint
           command: "npm run lint"

services:
    - name: postgres
      image: postgres:17
      user: "999:999"
      environment:
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: factory
          POSTGRES_DB: factory_test
